<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05050a" />
  <title>Привет! Это мой первый файл, который собрал ИИ-агент</title>
  <style>
    :root {
      --ink: #f4f2ff;
      --violet: #8b5cf6;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      overflow-x: hidden;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background-color: #05050a;
      background-image:
        radial-gradient(60% 50% at 50% 0%, rgba(139, 92, 246, 0.18), transparent 70%),
        linear-gradient(165deg, #05050a 0%, #0b0918 48%, #150d26 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Медленно дрейфующие цветные пятна на фоне */
    .aura {
      position: fixed;
      inset: -25%;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 30% 36%, rgba(139, 92, 246, 0.24), transparent 55%),
        radial-gradient(circle at 70% 64%, rgba(34, 211, 238, 0.16), transparent 55%);
      filter: blur(50px);
      animation: drift 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -2%, 0) rotate(-2deg) scale(1); }
      to   { transform: translate3d(2%, 3%, 0) rotate(2deg) scale(1.08); }
    }

    .stage {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 6.4vw, 4.9rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.025em;
      text-wrap: balance;
      text-shadow:
        0 0 12px rgba(196, 181, 253, 0.30),
        0 0 34px rgba(139, 92, 246, 0.50),
        0 0 80px rgba(34, 211, 238, 0.25),
        0 4px 24px rgba(0, 0, 0, 0.55);
      animation:
        rise-in 1.15s 0.1s cubic-bezier(0.16, 0.84, 0.28, 1) both,
        halo 5s 1.3s ease-in-out infinite;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.985);
        filter: blur(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes halo {
      0%, 100% {
        text-shadow:
          0 0 12px rgba(196, 181, 253, 0.30),
          0 0 34px rgba(139, 92, 246, 0.50),
          0 0 80px rgba(34, 211, 238, 0.25),
          0 4px 24px rgba(0, 0, 0, 0.55);
      }
      50% {
        text-shadow:
          0 0 18px rgba(196, 181, 253, 0.45),
          0 0 54px rgba(139, 92, 246, 0.72),
          0 0 112px rgba(34, 211, 238, 0.40),
          0 4px 24px rgba(0, 0, 0, 0.55);
      }
    }

    .cta {
      margin-top: clamp(28px, 5vh, 48px);
      animation: rise-in 0.9s 0.5s cubic-bezier(0.16, 0.84, 0.28, 1) both;
    }

    button {
      padding: 18px 46px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #0b0616;
      cursor: pointer;
      background-image: linear-gradient(120deg, #ddd6fe 0%, #a78bfa 40%, #22d3ee 100%);
      background-size: 160% 100%;
      background-position: 0% 50%;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.22),
        0 10px 30px rgba(139, 92, 246, 0.45),
        0 0 60px rgba(34, 211, 238, 0.22);
      transition:
        transform 0.2s ease,
        box-shadow 0.35s ease,
        background-position 0.45s ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      background-position: 100% 50%;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.3),
        0 14px 40px rgba(139, 92, 246, 0.55),
        0 0 90px rgba(34, 211, 238, 0.35);
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    button:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 4px;
    }

    #confetti {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="aura" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="stage">
    <h1>Привет! Это мой первый файл, который собрал ИИ-агент</h1>
    <div class="cta">
      <button id="spark" type="button">Нажми меня</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const button = document.getElementById("spark");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const COLORS = ["#a78bfa", "#8b5cf6", "#67e8f9", "#22d3ee", "#f472b6", "#fbbf24", "#4ade80"];

      let particles = [];
      let raf = null;
      let viewW = 0;
      let viewH = 0;
      let dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
        canvas.style.width = viewW + "px";
        canvas.style.height = viewH + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawn(x, y, count) {
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.55;
          const speed = (reduceMotion ? 5 : 10) + Math.random() * (reduceMotion ? 7 : 14);
          const size = 5 + Math.random() * 8;

          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.2 + Math.random() * 0.1,
            drag: 0.99,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.4,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.08 + Math.random() * 0.12,
            w: size,
            h: size * (0.38 + Math.random() * 0.45),
            color: COLORS[(Math.random() * COLORS.length) | 0],
            life: 100 + Math.random() * 80
          });
        }

        if (raf === null) raf = requestAnimationFrame(frame);
      }

      function frame() {
        ctx.clearRect(0, 0, viewW, viewH);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];

          p.vy += p.gravity;
          p.vx *= p.drag;
          p.vy *= p.drag;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          p.wobble += p.wobbleSpeed;
          p.life -= 1;

          if (p.life <= 0 || p.y > viewH + 80 || p.x < -100 || p.x > viewW + 100) {
            particles.splice(i, 1);
            continue;
          }

          // Лёгкое «порхание» бумажки
          const squash = 0.25 + 0.75 * Math.abs(Math.cos(p.wobble));
          const w = p.w * squash;

          ctx.save();
          ctx.globalAlpha = Math.min(1, p.life / 35);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-w / 2, -p.h / 2, w, p.h);
          ctx.restore();
        }

        if (particles.length > 0) {
          raf = requestAnimationFrame(frame);
        } else {
          raf = null;
          ctx.clearRect(0, 0, viewW, viewH);
        }
      }

      button.addEventListener("click", (event) => {
        const rect = button.getBoundingClientRect();
        const fromKeyboard = event.detail === 0;

        const x = fromKeyboard ? rect.left + rect.width / 2 : event.clientX;
        const y = fromKeyboard ? rect.top + rect.height / 2 : event.clientY;

        spawn(x, y, reduceMotion ? 50 : 180);
      });

      window.addEventListener("resize", resize);
      resize();
    })();
  </script>
</body>
</html>
